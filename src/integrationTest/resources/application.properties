# backend configuration file
info.version=@project.version@

# mqttConfig:
mqtt.url=tcp://localhost:1883
mqtt.username=johndoe
mqtt.password=secret
mqtt.caFilePath=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
mqtt.crtFilePath=null
mqtt.clientKeyFilePath=null

# databaseConfig:
javax.persistence.jdbc.url=jdbc:mariadb://localhost:3306/domiot?transformedBitIsBoolean=true&serverTimezone=Europe/Amsterdam
spring.datasource.url=jdbc:mariadb://localhost:3306/domiot
spring.datasource.username=domiot
spring.datasource.password=domiotpassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
hibernate.dialect=

spring.flyway.user=admin
spring.flyway.password=password

spring.main.allow-bean-definition-overriding=true
spring.main.bind-to-environment=true
spring.main.fail-on-missing-bean=true
spring.config.use-legacy-processing=false

spring.lifecycle.timeout-per-shutdown-phase=1s