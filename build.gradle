buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "gradle.plugin.com.github.johnrengelman:shadow:7.1.2"
    }
}

plugins {
    id 'io.freefair.lombok' version '8.6' // Apply lombok to all source sets
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'

    id 'java'
    id 'maven-publish'
    id 'jacoco'
    id "org.sonarqube" version "4.4.1.3373"
}

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId findProperty('group')
            artifactId findProperty('name')
            version findProperty('version')
        }
    }
}

ext {
    springBootVersion = '3.5.11'
    set('testcontainers.version', '1.21.4')
}

dependencies {
    implementation "org.domiot:domiot-datatypes:0.10.0-SNAPSHOT"
    implementation "org.domiot:domiot-rest-api:1.4.0-SNAPSHOT"
    implementation "org.springframework.data:spring-data-jpa:$springBootVersion"
    implementation "org.springframework.data:spring-data-commons:$springBootVersion"
    implementation "org.springframework.integration:spring-integration-mqtt:6.3.7"
    implementation "org.springframework.integration:spring-integration-jmx:6.3.7"
    implementation "org.springframework.integration:spring-integration-core:6.3.7"
    implementation "org.springframework.boot:spring-boot-starter:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-validation:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"
    implementation "org.mariadb.jdbc:mariadb-java-client:3.3.3"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-hibernate5:2.20.1"
    implementation "com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:2.20.1"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0-rc1"
    implementation "org.mapstruct:mapstruct:1.6.0.Beta1"
    implementation "org.mapstruct:mapstruct-processor:1.6.0.Beta1"
    compileOnly "org.projectlombok:lombok:1.18.32"
    implementation "org.projectlombok:lombok-mapstruct-binding:0.2.0"
    implementation "javax.xml.bind:jaxb-api:2.4.0-b180830.0359"
    implementation "ch.qos.logback:logback-core:1.5.25"
    implementation "ch.qos.logback:logback-classic:1.5.25"

    annotationProcessor "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.mapstruct:mapstruct-processor:1.6.0.Beta1"
    //    implementation group: 'javax.validation', name: 'validation-api', version: '2.0.1.Final'

    testImplementation "org.slf4j:slf4j-api:2.0.12"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0-M1"
    testImplementation "org.projectlombok:lombok:1.18.32"
    testImplementation "org.springframework.boot:spring-boot-starter-test:$springBootVersion"
    testImplementation "org.testcontainers:junit-jupiter:1.21.4"
    testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"
    testImplementation "org.testcontainers:mariadb:1.21.4"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.junit.platform:junit-platform-runner:1.11.0-M1"
    testImplementation "org.hamcrest:hamcrest-junit:2.0.0.0"
    testImplementation "ch.qos.logback:logback-classic:1.5.25"
    testImplementation "ch.qos.logback:logback-core:1.5.25"

    testAnnotationProcessor "org.projectlombok:lombok:1.18.32"
    testAnnotationProcessor "org.mapstruct:mapstruct-processor:1.6.0.Beta1"
}

test {
    // Workaround for using Gradle as executor of unit tests
    useJUnitPlatform()
    ignoreFailures = !project.hasProperty('release')
    finalizedBy jacocoTestReport // report is always generated after tests run
    exclude '**/integrationTest/**'
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    environment 'DOCKER_API_VERSION', '1.41'
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

sonarqube {
    properties {
        property "sonar.gradle.skipCompile", "true"
        property "sonar.sources", "src/main/java"
        property "sonar.tests", "src/test/java,src/integrationTest/java"
        property "sonar.java.test.includes", "**/*Test.java,**/*IT.java"
        property "sonar.junit.reportPaths", "build/test-results/test,build/test-results/integrationTest"
        property "sonar.java.coveragePlugin", "jacoco"
        property "sonar.jacoco.reportPaths", "build/jacoco/test.exec,build/jacoco/integrationTest.exec"
    }
}

javadoc {
    exclude '**/generated/**'
    options.addStringOption('Xdoclint:none', '-quiet')
}


jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
    executionData fileTree(dir: '.', include: [
            'build/jacoco/test.exec',
            'build/jacoco/integrationTest.exec'
    ])
    sourceDirectories.setFrom files(['src/main/java'])
    classDirectories.setFrom files(['build/classes/java/main'])
}
